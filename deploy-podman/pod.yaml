apiVersion: v1
kind: Pod
metadata:
  name: tybooks
spec:
  containers:
    - name: postgres
      image: docker.m.daocloud.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_DB
          value: tybooks
        - name: POSTGRES_USER
          value: tybooks
        - name: POSTGRES_PASSWORD
          value: "<YOUR_POSTGRES_PASSWORD>"
      volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
      readinessProbe:
        exec:
          command:
            - pg_isready
            - -U
            - tybooks
        initialDelaySeconds: 5
        periodSeconds: 5
      livenessProbe:
        exec:
          command:
            - pg_isready
            - -U
            - tybooks
        initialDelaySeconds: 10
        periodSeconds: 30
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 256Mi

    - name: app
      # 版本号与 package.json 保持一致
      image: docker.io/library/tybooks:1.1.0
      env:
        - name: DATABASE_URL
          value: "postgresql://tybooks:<YOUR_POSTGRES_PASSWORD>@localhost:5432/tybooks"
        - name: DATABASE_URL_READONLY
          value: "postgresql://tybooks:<YOUR_POSTGRES_PASSWORD>@localhost:5432/tybooks"
        - name: JWT_SECRET
          value: "<YOUR_JWT_SECRET>"
      ports:
        - containerPort: 8080
          hostPort: 8080
      readinessProbe:
        httpGet:
          path: /api/auth/check
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /api/auth/check
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 30
      resources:
        limits:
          memory: 256Mi
        requests:
          memory: 128Mi

  volumes:
    - name: pg-data
      hostPath:
        path: /var/lib/tybooks/pg-data
        type: DirectoryOrCreate
