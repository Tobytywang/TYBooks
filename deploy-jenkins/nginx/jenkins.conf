# TYBooks Jenkins Nginx 反向代理配置
# 放置到 /etc/nginx/conf.d/jenkins.conf
# 替换 YOUR_JENKINS_DOMAIN 与证书路径后执行：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_JENKINS_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_JENKINS_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/YOUR_JENKINS_DOMAIN.pem;
    ssl_certificate_key /etc/nginx/ssl/YOUR_JENKINS_DOMAIN.key;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:30081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
