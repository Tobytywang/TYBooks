apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: tybooks
type: Opaque
stringData:
  DATABASE_URL: postgresql://tybooks:CHANGE_ME@postgres:5432/tybooks
  DATABASE_URL_READONLY: postgresql://tybooks:CHANGE_ME@postgres:5432/tybooks
  JWT_SECRET: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tybooks-app
  namespace: tybooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tybooks-app
  template:
    metadata:
      labels:
        app: tybooks-app
    spec:
      containers:
        - name: tybooks-app
          image: tybooks:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /api/auth/check
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/check
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tybooks-app
  namespace: tybooks
spec:
  selector:
    app: tybooks-app
  ports:
    - port: 8080
      targetPort: 8080
