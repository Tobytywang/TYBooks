apiVersion: apps/v1
kind: Deployment
metadata:
  name: tybooks-app
  namespace: tybooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tybooks-app
  template:
    metadata:
      labels:
        app: tybooks-app
    spec:
      containers:
        - name: tybooks-app
          image: docker.io/library/tybooks:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /api/auth/check
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/check
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tybooks-app
  namespace: tybooks
spec:
  type: NodePort
  selector:
    app: tybooks-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
